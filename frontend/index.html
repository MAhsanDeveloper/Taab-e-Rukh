<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->

    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.thesgrgroup.com/" />
    <meta property="og:title" content="Taab e Rukh | Premium Skincare & Beauty Products in Pakistan" />
    <meta property="og:description" content="Shop high-quality skincare and beauty products from Taab e Rukh. Serums, moisturizers, oils, and more – delivered across Pakistan." />
    <meta property="og:image" content="https://www.thesgrgroup.com/logo.webp" />
    <meta property="og:site_name" content="Taab e Rukh" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.thesgrgroup.com/" />
    <meta property="twitter:title" content="Taab e Rukh | Premium Skincare & Beauty Products in Pakistan" />
    <meta property="twitter:description" content="Discover premium skincare & beauty essentials at Taab e Rukh. Shop online with fast delivery across Pakistan." />
    <meta property="twitter:image" content="https://www.thesgrgroup.com/logo.webp" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.thesgrgroup.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.webp" />

    <!-- Schema.org JSON-LD for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Taab e Rukh",
      "url": "https://www.thesgrgroup.com",
      "logo": "https://www.thesgrgroup.com/logo.webp",
      "sameAs": [
        "https://www.facebook.com/thesgrgroup",
        "https://www.instagram.com/thesgrgroup"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+923465611273",
        "contactType": "customer service",
        "areaServed": "PK",
        "availableLanguage": "en"
      }
    }
    </script>

    <!-- Google Analytics (Vite dynamic) -->
    <script type="module">
      import.meta.env.VITE_GA_MEASUREMENT_ID &&
      (() => {
        const gaId = import.meta.env.VITE_GA_MEASUREMENT_ID;
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', gaId);
      })();
    </script>

    <!-- Preload important assets for faster load -->
    <link rel="preload" as="image" href="/logo.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
